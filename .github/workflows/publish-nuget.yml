name: Publish to GitHub Packages

on:
  workflow_dispatch:
    inputs:
      version:
        description: 'Package version (e.g., 0.5.0)'
        required: true
        type: string
      dry-run:
        description: 'Dry run — pack only, skip push'
        required: false
        type: boolean
        default: false

env:
  DOTNET_VERSION: '10.0.x'
  DOTNET_NOLOGO: true
  DOTNET_CLI_TELEMETRY_OPTOUT: true
  PROJECT_PATH: src/RoslynNavigator.csproj
  TEST_PATH: tests/RoslynNavigator.Tests.csproj
  PACKAGE_NAME: RoslynNavigator

jobs:
  test:
    name: Test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: ${{ env.DOTNET_VERSION }}

      - name: Test
        run: dotnet test ${{ env.TEST_PATH }} -c Release --logger trx --results-directory TestResults

      - name: Upload test results
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: test-results
          path: TestResults/*.trx

  pack:
    name: Pack
    runs-on: ubuntu-latest
    needs: test
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: ${{ env.DOTNET_VERSION }}

      - name: Pack
        run: dotnet pack ${{ env.PROJECT_PATH }} -c Release -o ./nupkg /p:Version=${{ inputs.version }} /p:ContinuousIntegrationBuild=true

      - name: Upload package
        uses: actions/upload-artifact@v4
        with:
          name: nuget-package
          path: ./nupkg/*

  publish:
    name: Publish
    runs-on: ubuntu-latest
    needs: pack
    if: ${{ inputs.dry-run == false }}
    permissions:
      packages: write
      contents: write
    steps:
      - name: Download package
        uses: actions/download-artifact@v4
        with:
          name: nuget-package
          path: ./nupkg

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: ${{ env.DOTNET_VERSION }}
          source-url: https://nuget.pkg.github.com/${{ github.repository_owner }}/index.json
        env:
          NUGET_AUTH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Push to GitHub Packages
        run: dotnet nuget push ./nupkg/${{ env.PACKAGE_NAME }}.${{ inputs.version }}.nupkg --source https://nuget.pkg.github.com/${{ github.repository_owner }}/index.json --api-key ${{ secrets.GITHUB_TOKEN }} --skip-duplicate --timeout 600

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ inputs.version }}
          name: ${{ env.PACKAGE_NAME }} v${{ inputs.version }}
          body: |
            ## Install

            Requires authentication with GitHub Packages. Add the source once:

            ```bash
            dotnet nuget add source https://nuget.pkg.github.com/${{ github.repository_owner }}/index.json \
              --name github-synthetix \
              --username YOUR_GITHUB_USERNAME \
              --password YOUR_GITHUB_PAT \
              --store-password-in-clear-text
            ```

            Then install the tool:

            ```bash
            dotnet tool install -g ${{ env.PACKAGE_NAME }} --version ${{ inputs.version }} --add-source https://nuget.pkg.github.com/${{ github.repository_owner }}/index.json
            ```

            See [README](https://github.com/${{ github.repository }}/blob/main/README.md) for details.
          generate_release_notes: true
          files: ./nupkg/*
