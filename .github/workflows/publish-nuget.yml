name: Publish to GitHub Packages

on:
  push:
    tags:
      - 'v*.*.*'
  workflow_dispatch:
    inputs:
      tag:
        description: 'Tag to publish (e.g., v1.0.0)'
        required: true
        type: string

env:
  DOTNET_VERSION: '10.0.x'
  DOTNET_NOLOGO: true
  DOTNET_CLI_TELEMETRY_OPTOUT: true
  PROJECT_PATH: src/RoslynNavigator.csproj
  TEST_PATH: tests/RoslynNavigator.Tests.csproj
  PACKAGE_NAME: RoslynNavigator

jobs:
  validate-tag:
    name: Validate Tag Format
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.extract-version.outputs.version }}
      tag: ${{ steps.extract-version.outputs.tag }}
    steps:
      - name: Extract version from tag
        id: extract-version
        run: |
          if [[ "${{ github.ref }}" =~ ^refs/tags/v([0-9]+\.[0-9]+\.[0-9]+)$ ]]; then
            VERSION="${BASH_REMATCH[1]}"
            TAG="${{ github.ref_name }}"
          else
            VERSION="${{ inputs.tag }}"
            TAG="${{ inputs.tag }}"
            if [[ ! "$VERSION" =~ ^v?[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
              echo "❌ Invalid tag format: $VERSION"
              echo "Valid format: v1.0.0 or 1.0.0"
              exit 1
            fi
            # Ensure version starts with 'v' for consistency
            [[ "$VERSION" =~ ^v ]] || VERSION="v$VERSION"
          fi
          VERSION_NO_V="${VERSION#v}"
          echo "version=$VERSION_NO_V" >> $GITHUB_OUTPUT
          echo "tag=$TAG" >> $GITHUB_OUTPUT
          echo "✅ Validated version: $VERSION_NO_V"

  test:
    name: Test
    runs-on: ubuntu-latest
    needs: validate-tag
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: ${{ env.DOTNET_VERSION }}

      - name: Restore dependencies
        run: dotnet restore

      - name: Test
        run: dotnet test ${{ env.TEST_PATH }} -c Release --logger trx --results-directory TestResults

      - name: Upload test results
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: test-results
          path: TestResults/*.trx

  pack:
    name: Pack
    runs-on: ubuntu-latest
    needs: [validate-tag, test]
    outputs:
      package-path: ${{ steps.pack.outputs.package-path }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: ${{ env.DOTNET_VERSION }}

      - name: Restore dependencies
        run: dotnet restore

      - name: Pack
        id: pack
        run: |
          dotnet pack ${{ env.PROJECT_PATH }} -c Release -o ./nupkg \
            /p:Version=${{ needs.validate-tag.outputs.version }} \
            /p:ContinuousIntegrationBuild=true
          PACKAGE_FILE="./nupkg/${{ env.PACKAGE_NAME }}.${{ needs.validate-tag.outputs.version }}.nupkg"
          echo "package-path=$PACKAGE_FILE" >> $GITHUB_OUTPUT
          echo "✅ Package created: $PACKAGE_FILE"

      - name: Upload package
        uses: actions/upload-artifact@v4
        with:
          name: nuget-package
          path: ./nupkg/*
          retention-days: 7

  publish:
    name: Publish to GitHub Packages
    runs-on: ubuntu-latest
    needs: [validate-tag, pack]
    permissions:
      packages: write
      contents: write
    steps:
      - name: Download package
        uses: actions/download-artifact@v4
        with:
          name: nuget-package
          path: ./nupkg

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: ${{ env.DOTNET_VERSION }}
          source-url: https://nuget.pkg.github.com/${{ github.repository_owner }}/index.json
        env:
          NUGET_AUTH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Push to GitHub Packages
        run: |
          dotnet nuget push ./nupkg/${{ env.PACKAGE_NAME }}.${{ needs.validate-tag.outputs.version }}.nupkg \
            --source https://nuget.pkg.github.com/${{ github.repository_owner }}/index.json \
            --api-key ${{ secrets.GITHUB_TOKEN }} \
            --skip-duplicate
          echo "✅ Package published: ${{ env.PACKAGE_NAME }} v${{ needs.validate-tag.outputs.version }}"

      - name: Push symbol package
        run: |
          SNUPKG="./nupkg/${{ env.PACKAGE_NAME }}.${{ needs.validate-tag.outputs.version }}.snupkg"
          if [ -f "$SNUPKG" ]; then
            dotnet nuget push "$SNUPKG" \
              --source https://nuget.pkg.github.com/${{ github.repository_owner }}/index.json \
              --api-key ${{ secrets.GITHUB_TOKEN }} \
              --skip-duplicate
            echo "✅ Symbol package published"
          fi

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ needs.validate-tag.outputs.tag }}
          name: ${{ env.PACKAGE_NAME }} ${{ needs.validate-tag.outputs.tag }}
          body: |
            ## 📦 Release: ${{ env.PACKAGE_NAME }} v${{ needs.validate-tag.outputs.version }}

            ### Install

            Requires authentication with GitHub Packages. Add the source once:

            ```bash
            dotnet nuget add source https://nuget.pkg.github.com/${{ github.repository_owner }}/index.json \
              --name github-synthetix-ai \
              --username YOUR_GITHUB_USERNAME \
              --password YOUR_GITHUB_PAT \
              --store-password-in-clear-text
            ```

            Then install the tool:

            ```bash
            dotnet tool install -g ${{ env.PACKAGE_NAME }} --version ${{ needs.validate-tag.outputs.version }}
            ```

            Or update an existing installation:

            ```bash
            dotnet tool update -g ${{ env.PACKAGE_NAME }} --version ${{ needs.validate-tag.outputs.version }}
            ```

            For more details, see [README](https://github.com/${{ github.repository }}/blob/main/README.md).

            ---
            **Published:** ${{ github.event.head_commit.timestamp }}
          generate_release_notes: true
          files: ./nupkg/*
          draft: false
          prerelease: false
